<div class="interactive-widget strudel-widget" data-widget="strudel" id="{{ include.id | default: 'strudel-sketch' }}" {% if include.code %}data-code="{{ include.code | escape }}"{% endif %} {% if include.url %}data-url="{{ include.url }}"{% endif %}>
  <div class="interactive-header">
    <div class="interactive-meta">
      <span class="interactive-badge">STRUDEL</span>
      {% if include.title %}<span class="interactive-title">{{ include.title }}</span>{% endif %}
    </div>
    <div class="interactive-controls">
      <button type="button" class="btn btn-sm fullscreen-btn" title="Toggle Fullscreen" style="display: none;" onclick="toggleWidgetFullscreen(this.closest('.interactive-widget'))">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
        Fullscreen
      </button>
    </div>
  </div>
  <div class="strudel-repl-container">
    <div class="interactive-placeholder">
      <p class="interactive-caption">Algorithmic Livecoded Music &middot; Web Audio</p>
      <button type="button" class="btn btn-primary init-interactive-btn">
        Initialize Strudel Audio
      </button>
    </div>
  </div>
</div>
