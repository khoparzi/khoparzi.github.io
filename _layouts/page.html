---
layout: base.html
---

<article class="page-content prose">
  {% if title and title != "----" %}
  <header class="page-header">
    <h1>{{ title }}</h1>
    {% if subtitle %}
    <p class="hero-subtitle">{{ subtitle }}</p>
    {% endif %}
  </header>
  {% endif %}

  <div class="prose-body">
    {{ content }}
  </div>
</article>
