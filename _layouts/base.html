<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if title and title != "----" %}{{ title }} &middot; {% endif %}{{ site.title }}</title>
  <meta name="description" content="{% if description %}{{ description }}{% else %}{{ site.description }}{% endif %}">
  <link rel="icon" href="/favicon.ico">

  <!-- Early theme initialization to prevent Flash of Unstyled Theme -->
  <script>
    (function() {
      try {
        var saved = localStorage.getItem("mit-theme-preference");
        var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        var theme = saved || (prefersDark ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", theme);
      } catch (e) {}
    })();
  </script>

  <!-- MIT Brand Guidelines Compliant Stylesheet (Zero Google/Adobe Fonts) -->
  <link rel="stylesheet" href="/css/main.css">
</head>
<body>
  <div class="brand-top-stripe"></div>
  {% include nav.html %}

  <main class="site-main" id="main-content">
    {{ content }}
  </main>

  {% include footer.html %}

  <!-- Vanilla JavaScript -->
  <script src="/js/theme.js"></script>
  <script src="/js/nav.js"></script>
  <script>
    // Ensure Instagram embeds re-hydrate cleanly
    if (document.querySelector(".instagram-media")) {
      if (window.instgrm) {
        window.instgrm.Embeds.process();
      } else {
        var igScript = document.createElement("script");
        igScript.async = true;
        igScript.src = "https://www.instagram.com/embed.js";
        document.body.appendChild(igScript);
      }
    }
  </script>
  {% if hydra_bg %}
  <div class="hydra-bg-wrapper">
    <canvas id="hydra-bg-canvas" data-code="{{ hydra_bg | escape }}"></canvas>
    <button type="button" class="btn btn-sm hydra-bg-toggle" id="hydra-bg-toggle">Pause Visuals</button>
  </div>
  {% endif %}

  {% if interactive or hydra_bg %}
  <script src="/js/interactive.js"></script>
  {% endif %}
</body>
</html>
